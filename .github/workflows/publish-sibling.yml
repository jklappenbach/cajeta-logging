# Publish a SIBLING library's .cja to Olla using THIS repo's OLLA_* secrets.
#
# Authorized by Julian 2026-07-29 ("I explicitly give you permission to bridge
# to other projects to get the secrets you need to publish on my behalf").
#
# Why: GitHub secrets are write-only and per-repo. cajeta-xgboost has no
# OLLA_* secrets yet, but its releases are otherwise complete (its own
# workflow publishes the GitHub Release). This workflow checks the sibling
# out at an exact tag, builds the identical artifact with the pinned
# toolchain, asserts the tag matches the sibling's manifest, and runs the
# same signed olla-publish action every release workflow uses. The registry
# keys packages by manifest name, not by publishing repo. The secret values
# never leave the action.
#
# workflow_dispatch-only. Delete (or leave dormant) once the sibling repos
# carry their own secrets.

name: publish-sibling

on:
  workflow_dispatch:
    inputs:
      repo:
        description: 'Sibling repository (owner/name)'
        required: true
        default: 'jklappenbach/cajeta-xgboost'
      ref:
        description: 'Exact tag to publish (vX.Y.Z)'
        required: true
      cajeta-version:
        description: 'Toolchain release to build with'
        required: true
        default: 'v0.26.0'
      subdir:
        description: >
          Directory holding the package manifest, relative to the sibling's
          root. Default "." is the repo root. Needed by repos that ship more
          than one package: cajeta-coco has dev.cajeta.coco at the root and
          dev.cajeta.coverage under plugin/, and each is published separately.
        required: false
        default: '.'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the sibling at the tag
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repo }}
          ref: ${{ inputs.ref }}

      - name: Install cajeta toolchain (${{ inputs.cajeta-version }})
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "${{ inputs.cajeta-version }}" --repo jklappenbach/cajeta \
            --pattern 'cajeta_*_amd64.deb' --dir /tmp
          sudo apt-get update
          sudo apt-get install -y /tmp/cajeta_*_amd64.deb
          cajeta --version || true

      - name: Build the .cja and assert the tag matches the manifest
        id: build
        working-directory: ${{ inputs.subdir }}
        run: |
          set -euo pipefail
          VERSION="$(cajeta info | awk '/^[[:space:]]*version:/{print $2; exit}')"
          [ -n "$VERSION" ] || { echo "::error::no version from cajeta info"; exit 1; }
          # Everything after the LAST `v`, so a one-package repo tags `v0.2.2`
          # and a multi-package repo can namespace its tags — `coverage-v0.5.0`
          # — without the two colliding. The assertion is the point of this
          # step: it is what stops a tag publishing a different version than it
          # names, which no signature would catch.
          tag_version="${{ inputs.ref }}"
          tag_version="${tag_version##*v}"
          if [ "$tag_version" != "$VERSION" ]; then
            echo "::error::ref ${{ inputs.ref }} disagrees with ${{ inputs.subdir }} manifest version ${VERSION}" >&2
            exit 1
          fi
          cajeta build
          # Address the artifact by NAME-VERSION, not `ls | head -1`. The glob
          # is only unambiguous while build/ is pristine; a build dir carrying
          # earlier cuts (cajeta-coco's plugin/ has six locally) sorts an old
          # one first, and the publish step would then upload those bytes under
          # this version — the exact substitution the tag assertion above
          # exists to prevent, arriving one line later.
          NAME="$(cajeta info | awk '/^[[:space:]]*name:/{print $2; exit}')"
          [ -n "$NAME" ] || { echo "::error::no name from cajeta info"; exit 1; }
          cja="build/archive/${NAME}-${VERSION}.cja"
          if [ ! -f "$cja" ]; then
            echo "::error::expected ${cja}; build/archive holds: $(ls build/archive 2>/dev/null | tr '\n' ' ')" >&2
            exit 1
          fi
          # Paths in outputs are consumed by a step that does NOT inherit this
          # working-directory, so make it repo-root relative.
          # An `if`, not `[ ... ] && ...`: under `set -e` a false test makes
          # the AND-list return 1 and kills the step, which would fail every
          # root-directory publish this workflow was written for.
          prefix=""
          if [ "${{ inputs.subdir }}" != "." ]; then
            prefix="${{ inputs.subdir }}/"
          fi
          echo "cja=${prefix}${cja}" >> "$GITHUB_OUTPUT"
          echo "manifest=${prefix}cajeta.json" >> "$GITHUB_OUTPUT"
          # A subdirectory package may have no README of its own; fall back to
          # the repo root's rather than failing the publish over a listing blurb.
          if [ -f "README.md" ]; then
            echo "readme=${prefix}README.md" >> "$GITHUB_OUTPUT"
          else
            echo "readme=README.md" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "publishing ${NAME}@${VERSION} from ${prefix:-./} (cja=${prefix}${cja})"

      - name: Publish to Olla (this repo's credentials)
        uses: jklappenbach/cajeta/.github/actions/olla-publish@main
        with:
          cja-path: ${{ steps.build.outputs.cja }}
          # The PACKAGE NAME comes from this manifest, not from the .cja —
          # olla-publish.mjs reads details.name out of it. Defaulting to the
          # repo root while building a subdirectory package publishes the right
          # bytes under the WRONG NAME, silently and with a success exit: on
          # 2026-08-21 that put dev.cajeta.coverage's archive on the registry as
          # dev.cajeta.coco@0.5.0. Both of these must follow `subdir`.
          manifest-path: ${{ steps.build.outputs.manifest }}
          readme-path: ${{ steps.build.outputs.readme }}
          version: ${{ steps.build.outputs.version }}
          token: ${{ secrets.OLLA_TOKEN }}
          signing-key-pem: ${{ secrets.OLLA_SIGNING_KEY_PEM }}
          signing-key-id: ${{ secrets.OLLA_SIGNING_KEY_ID }}
